spring.application.name=missingbikes
spring.datasource.url=jdbc:postgresql://localhost:5433/missingbikes
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

debug=false

google.maps.api-key=${GOOGLE_MAPS_API_KEY}
google.places.api-key=${GOOGLE_PLACES_API_KEY}
bike.photos.upload-dir=uploads
bike.photos.url-prefix=/photos

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=45MB

spring.web.error.include-stacktrace=never