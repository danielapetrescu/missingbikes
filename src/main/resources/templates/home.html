<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>missingbikes.dk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container mt-4">

    <div class="d-flex align-items-center gap-2">
        <i class="ti ti-bike" style="color:#0E4C5C; font-size:26px;"></i>
        <span class="brand-title">missingbikes.dk</span>
    </div>
    <p class="tagline mb-4">Because we care about people and their bikes</p>
    <a th:href="@{/add}" class="btn btn-add">Add a found bike</a>

    <p th:if="${bikes.isEmpty()}" class="empty-note">No bikes in list yet.</p>

    <div class="bike-grid">
        <div class="bike-card" th:each="bike : ${bikes}">
            <img th:if="${!bike.photos.isEmpty()}"
                 th:src="@{'/photos/' + ${bike.photos[0].path}}"
                 class="bike-photo" alt="Found bike">

            <div class="bike-body">
                <h5 class="bike-brand" th:text="${bike.brand.name}">Trek</h5>
                <span class="bike-color" th:text="${bike.color.displayName}">Blue</span>

                <p class="bike-description"
                   th:if="${bike.description != null}"
                   th:text="${bike.description}">Description of the bike</p>

                <p class="bike-meta">
                    <i class="ti ti-map-pin"></i>
                    <a class="bike-address-link"
                       th:href="${bike.latitude != null and bike.longitude != null}
                                ? |https://www.google.com/maps/search/?api=1&amp;query=${bike.latitude},${bike.longitude}|
                                : |https://www.google.com/maps/search/?api=1&amp;query=${#uris.escapeQueryParam(bike.address)}|"
                       target="_blank" rel="noopener"
                       th:text="${bike.address}">Found Address  </a>
                </p>
                <p class="bike-meta">
                    <i class="ti ti-calendar"></i>
                    <span th:text="${bike.date}">Found Date </span>
                </p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
