<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>missingbikes.dk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container mt-4">

    <div class="d-flex align-items-center gap-2">
        <i class="ti ti-bike" style="color:#0E4C5C; font-size:26px;"></i>
        <span class="brand-title">missingbikes.dk</span>
    </div>
    <p class="tagline mb-4">Because we care about people and their bikes</p>

    <div class="card">
        <p class="card-title mb-3">Add a found bike</p>

        <form id="addBikeForm" th:action="@{/add}" method="post" enctype="multipart/form-data">

            <div class="row g-3 mb-2">
                <div class="col-6">
                    <label for="brand" class="form-label">Brand *</label>
                    <select id="brand" name="brand" class="form-select" required>
                        <option th:each="brand : ${brands}"
                                th:value="${brand.id}"
                                th:text="${brand.name}"></option>
                    </select>
                    <button type="button" class="btn btn-link p-0 mt-1" onclick="toggleAddBrand()">+ Add brand</button>
                    <div id="addBrandGroup" class="d-flex gap-2 mt-2 d-none">
                        <input type="text" id="newBrandName" class="form-control form-control-sm" placeholder="New brand name">
                        <button type="button" class="btn btn-sm btn-location" onclick="saveNewBrand()">Save</button>
                        <button type="button" class="btn btn-sm btn-light" onclick="cancelAddBrand()">Cancel</button>
                    </div>
                    <div id="brandError" class="text-danger"></div>
                </div>
                <div class="col-6">
                    <label for="color" class="form-label">Color *</label>
                    <select id="color" name="color" class="form-select" required>
                        <option th:each="color : ${colors}"
                                th:value="${color}"
                                th:text="${color.displayName}"></option>
                    </select>
                </div>
            </div>

            <div class="mb-2">
                <label for="description" class="form-label">Description</label>
                <input type="text" id="description" name="description" maxlength="50" class="form-control">
            </div>

            <div class="mb-2">
                <label for="addressInput" class="form-label">Location *</label>
                <input type="text" id="addressInput" class="form-control" placeholder="Start typing an address...">
                <div id="suggestions" class="list-group"></div>
                <input type="hidden" id="latitude" name="latitude">
                <input type="hidden" id="longitude" name="longitude">
                <input type="hidden" id="address" name="address">
                <div id="locationError" class="text-danger"></div>
            </div>

            <button type="button" class="btn btn-location w-100 mb-3" onclick="useMyLocation()">Use my location</button>

            <div class="mb-3">
                <label for="photos" class="form-label">Photos (select up to 4) *</label>
                <input type="file" id="photos" name="photos" accept="image/*" multiple required onchange="validatePhotos()" class="form-control">
                <div id="photoError" class="text-danger"></div>
            </div>

            <div class="text-danger mb-3" th:if="${error != null}" th:text="${error}"></div>

            <button type="submit" class="btn btn-add w-100">Add bike</button>

        </form>
    </div>
</div>

<script>
    let timerId;
    document.getElementById("addressInput").addEventListener("input", function(){
        document.getElementById("latitude").value = "";
        document.getElementById("longitude").value = "";
        document.getElementById("address").value = "";
        let address = document.getElementById("addressInput").value;
        clearTimeout(timerId);
        if(address.length === 0){
            document.getElementById("suggestions").textContent = "";
            return;
        }

        timerId = setTimeout(function(){
            fetch("/api/address/suggestions?query=" + encodeURIComponent(address))
                .then(response => response.json())
                .then(list => {
                    const container = document.getElementById("suggestions");
                    container.innerHTML = "";
                    for(const s of list){
                        if(!s.placeId){
                            continue;
                        }
                        const el = document.createElement("div");
                        el.className = "list-group-item list-group-item-action";
                        el.style.cursor = "pointer";
                        el.textContent = s.text;
                        el.dataset.placeId = s.placeId;
                        el.addEventListener("click", function(){
                            fetch("/api/address/details?placeId=" + s.placeId)
                                .then(response => {
                                    if(!response.ok){
                                        document.getElementById("locationError").textContent = "Could not get the location for this address";
                                        return;
                                    }
                                    return response.json();
                                })
                                .then(coordinates => {
                                    if(!coordinates){
                                        return;
                                    }
                                    document.getElementById("latitude").value = coordinates.latitude;
                                    document.getElementById("longitude").value = coordinates.longitude;
                                    document.getElementById("address").value = s.text;
                                    document.getElementById("addressInput").value = s.text;
                                    document.getElementById("locationError").textContent = "";
                                    document.getElementById("suggestions").innerHTML = "";
                                })
                                .catch(error => {
                                    console.log("Address details error", error);
                                });
                        });
                        container.appendChild(el);
                    }
                })
                .catch(error => {
                    console.log("Address search error", error);
                });
        }, 500);
    });

    function useMyLocation() {
        navigator.geolocation.getCurrentPosition(
            function(position){
                let lat = position.coords.latitude;
                let long = position.coords.longitude;
                document.getElementById("latitude").value = lat;
                document.getElementById("longitude").value = long;

                fetch("/api/geocode?latitude="+lat+"&longitude="+long)
                    .then(response => response.text())
                    .then (address => {
                        if(!address){
                            document.getElementById("locationError").textContent = "Could not find an address for this location";
                        } else {
                            document.getElementById("addressInput").value = address;
                            document.getElementById("address").value = address;
                            document.getElementById("locationError").textContent = "";
                        }
                    })
                    .catch(error => {
                        console.log("Geocode error", error);
                    });
            },
            function(error){
                document.getElementById("locationError").textContent = "Error retrieving address: " + error;
            }
        );
    }

    function validatePhotos() {
        const maxSize = 10 * 1024 * 1024;
        document.getElementById("photoError").textContent = "";
        const photoInput = document.getElementById("photos");
        if(photoInput.files.length > 4){
            photoInput.value = "";
            document.getElementById("photoError").textContent = "You should select max 4 photos";
        } else {
            for(const f of photoInput.files){
                if(f.size > maxSize){
                    document.getElementById("photoError").textContent = "Photo should have maximum 10 MB";
                    photoInput.value = "";
                    return;
                }
            }
        }
    }

    function toggleAddBrand(){
        const el = document.getElementById("addBrandGroup");
        el.classList.toggle("d-none");
    }

    function saveNewBrand(){
        let newBrandName = document.getElementById("newBrandName").value;
        fetch("/api/brands", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({"name": newBrandName})
        })
            .then(response => {
                if(!response.ok){
                    document.getElementById("brandError").textContent = "Could not add brand";
                } else {
                    return response.json();
                }
            })
            .then(newBrand => {
                if(!newBrand){
                    return;
                }
                let el = document.createElement("option");
                el.value = newBrand.id;
                el.textContent = newBrand.name;
                document.getElementById("brand").appendChild(el);
                el.selected = true;
                document.getElementById("addBrandGroup").classList.add("d-none");
                document.getElementById("newBrandName").value = "";
                document.getElementById("brandError").textContent = "";
            })
            .catch(error => {
                console.log("Add brand error", error);
            });
    }

    function cancelAddBrand(){
        document.getElementById("addBrandGroup").classList.add("d-none");
        document.getElementById("newBrandName").value = "";
        document.getElementById("brandError").textContent = "";
    }

    document.getElementById("addBikeForm").addEventListener("submit", function(event){
        if(document.getElementById("address").value.length < 1){
            event.preventDefault();
            document.getElementById("locationError").textContent = "Please add location"
        } else {
            document.getElementById("locationError").textContent = "";
        }
    });
</script>
</body>
</html>
